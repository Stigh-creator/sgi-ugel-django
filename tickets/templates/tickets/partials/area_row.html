<tr id="area-row-{{ area.pk }}" data-area-id="{{ area.pk }}">
    <td class="ps-4">
        <div class="d-flex align-items-center">
            <div class="header-icon bg-light text-primary rounded-circle p-2 me-3" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-sitemap"></i>
            </div>
            <div class="d-flex flex-column">
                <span class="user-name-text fw-bold text-dark">{{ area.name }}</span>
            </div>
        </div>
    </td>
    <td>
        <span class="badge bg-secondary px-3 py-2 rounded-pill">
            {{ area.get_sede_principal_display|default:area.sede_principal }}
        </span>
    </td>
    <td class="text-center">
        <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-action btn-edit shadow-sm"
                    title="Editar área"
                    data-bs-toggle="modal"
                    data-bs-target="#modalEditarArea"
                    data-id="{{ area.pk }}"
                    data-name="{{ area.name }}"
                    data-sede="{{ area.sede_principal }}">
                <i class="bi bi-pencil-square"></i>
            </button>

            <form method="post"
                  action="{% url 'area_eliminar' area.pk %}"
                  class="d-inline js-delete-area-form"
                  data-name="{{ area.name }}">
                {% csrf_token %}
                <button type="submit"
                        class="btn btn-action btn-toggle-status btn-status-active shadow-sm"
                        title="Eliminar área"
                        style="color: #dc2626; background-color: #fef2f2; border-color: #fecaca;">
                    <i class="bi bi-trash"></i>
                </button>
            </form>
        </div>
    </td>
</tr>
