upstream django {
    server sgi-web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Archivos estáticos – servidos directamente desde disco
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Archivos media (fotos de perfil, adjuntos, etc.) – servidos directamente
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Todo lo demás va al servidor Django (Daphne / ASGI)
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare termina HTTPS antes de llegar aquí, siempre es https
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support para Django Channels
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }
}
